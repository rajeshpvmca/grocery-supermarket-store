<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Settings - Grocery & Supermarket</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        :root {
            --theme-color: #28a745;
            --theme-color-hover: #218838;
            --theme-light: rgba(40, 167, 69, 0.1);
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --bg-body: #f8fafc;
            --border-color: #e2e8f0;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-body); color: var(--text-dark); }
        .dash-card { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05); border: 1px solid var(--border-color); height: 100%; }
        .text-theme { color: var(--theme-color) !important; }
        .bg-theme { background-color: var(--theme-color) !important; color: white; }
        .bg-theme-light { background: var(--theme-light); color: var(--theme-color); }
        
        .nav-pills .nav-link { color: var(--text-muted); border-radius: 10px; font-weight: 500; padding: 12px 20px; transition: all 0.2s; margin-bottom: 8px; text-align: left; }
        .nav-pills .nav-link:hover { background: #f1f5f9; color: var(--text-dark); }
        .nav-pills .nav-link.active { background: var(--theme-light); color: var(--theme-color); }
        
        .form-label { font-weight: 500; font-size: 14px; color: var(--text-dark); }
        .form-control, .form-select { border-radius: 10px; padding: 12px 16px; border-color: var(--border-color); font-size: 14px; }
        .form-control:focus, .form-select:focus { border-color: var(--theme-color); box-shadow: 0 0 0 0.25rem rgba(40, 167, 69, 0.15); }
        
        .avatar-upload { position: relative; width: 120px; height: 120px; margin-bottom: 20px; }
        .avatar-upload img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .avatar-upload .upload-btn { position: absolute; bottom: 0; right: 0; width: 36px; height: 36px; background: var(--theme-color); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 3px solid #fff; transition: all 0.2s; }
        .avatar-upload .upload-btn:hover { background: var(--theme-color-hover); transform: scale(1.05); }

        .switch-custom .form-check-input { width: 2.5em; height: 1.25em; cursor: pointer; }
        .switch-custom .form-check-input:checked { background-color: var(--theme-color); border-color: var(--theme-color); }
        
        .chart-container { min-height: 250px; }
    </style>
</head>
<body>
    <div class="container-fluid py-4 px-lg-4">
        
        <div class="mb-4">
            <h4 class="fw-bold mb-1 text-dark">Account Settings</h4>
            <p class="text-muted mb-0 small">Manage your personal information, security, and preferences.</p>
        </div>

        <div class="row g-4">
            <!-- Sidebar -->
            <div class="col-12 col-md-4 col-xl-3">
                <div class="dash-card p-3">
                    <div class="nav flex-column nav-pills" role="tablist" aria-orientation="vertical">
                        <button class="nav-link active" data-bs-toggle="pill" type="button" role="tab"><i class="bi bi-person me-2"></i> Personal Info</button>
                        <button class="nav-link" data-bs-toggle="pill" type="button" role="tab"><i class="bi bi-shield-lock me-2"></i> Security</button>
                        <button class="nav-link" data-bs-toggle="pill" type="button" role="tab"><i class="bi bi-bell me-2"></i> Notifications</button>
                        <button class="nav-link" data-bs-toggle="pill" type="button" role="tab"><i class="bi bi-credit-card me-2"></i> Payment Methods</button>
                        <hr class="my-2 border-light">
                        <button class="nav-link text-danger" type="button"><i class="bi bi-box-arrow-right me-2"></i> Sign Out</button>
                    </div>
                </div>
            </div>

            <!-- Content Area -->
            <div class="col-12 col-md-8 col-xl-9">
                <div class="row g-4">
                    <div class="col-12">
                        <div class="dash-card">
                            <h5 class="fw-bold mb-4 border-bottom pb-3">Personal Information</h5>
                            
                            <div class="d-flex flex-column flex-sm-row align-items-center gap-4 mb-4">
                                <div class="avatar-upload">
                                    <img src="../assets/images/img_01.webp" alt="Profile">
                                    <div class="upload-btn"><i class="bi bi-camera-fill"></i></div>
                                </div>
                                <div>
                                    <h5 class="fw-bold mb-1">John Doe</h5>
                                    <p class="text-muted small mb-2">john.doe@example.com</p>
                                    <div class="d-flex gap-2">
                                        <button class="btn btn-sm btn-outline-secondary rounded-pill px-3">Remove</button>
                                    </div>
                                </div>
                            </div>

                            <form>
                                <div class="row g-3">
                                    <div class="col-12 col-sm-6">
                                        <label class="form-label">First Name</label>
                                        <input type="text" class="form-control" value="John">
                                    </div>
                                    <div class="col-12 col-sm-6">
                                        <label class="form-label">Last Name</label>
                                        <input type="text" class="form-control" value="Doe">
                                    </div>
                                    <div class="col-12 col-sm-6">
                                        <label class="form-label">Email Address</label>
                                        <input type="email" class="form-control" value="john.doe@example.com">
                                    </div>
                                    <div class="col-12 col-sm-6">
                                        <label class="form-label">Phone Number</label>
                                        <input type="text" class="form-control" value="+1 (555) 123-4567">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">Delivery Address</label>
                                        <textarea class="form-control" rows="3">123 Grocery Ave, Suite 4B&#10;Food City, FC 90210</textarea>
                                    </div>
                                    <div class="col-12 mt-4 text-end">
                                        <button type="button" class="btn btn-light me-2 fw-semibold rounded-pill px-4">Cancel</button>
                                        <button type="button" class="btn btn-theme fw-semibold rounded-pill px-4">Save Changes</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>

                    <div class="col-12 col-xl-6">
                        <div class="dash-card">
                            <h5 class="fw-bold mb-4 border-bottom pb-3">Security & Password</h5>
                            <form>
                                <div class="mb-3">
                                    <label class="form-label">Current Password</label>
                                    <input type="password" class="form-control" placeholder="Enter current password">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">New Password</label>
                                    <input type="password" class="form-control" placeholder="Create new password">
                                </div>
                                <div class="mb-4">
                                    <label class="form-label">Confirm New Password</label>
                                    <input type="password" class="form-control" placeholder="Confirm new password">
                                </div>
                                <button type="button" class="btn btn-theme fw-semibold rounded-pill w-100">Update Password</button>
                            </form>

                            <div class="mt-4 pt-4 border-top">
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <div>
                                        <h6 class="fw-bold mb-1">Two-Factor Authentication</h6>
                                        <p class="text-muted small mb-0">Secure your account with 2FA.</p>
                                    </div>
                                    <div class="form-check form-switch switch-custom">
                                        <input class="form-check-input" type="checkbox" checked>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-xl-6">
                        <div class="dash-card">
                            <h5 class="fw-bold mb-4 border-bottom pb-3">Account Activity</h5>
                            <p class="text-muted small mb-3">Your login frequency over the last week.</p>
                            <div id="activity_chart" class="chart-container"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Activity Chart
            var optionsActivity = {
                series: [{ name: 'Logins', data: [2, 1, 4, 2, 5, 1, 3] }],
                chart: { type: 'area', height: 250, toolbar: { show: false }, fontFamily: 'Inter, sans-serif' },
                colors: ['#28a745'],
                fill: { type: 'gradient', gradient: { shadeIntensity: 1, opacityFrom: 0.3, opacityTo: 0.05, stops: [0, 90, 100] } },
                dataLabels: { enabled: false },
                stroke: { curve: 'smooth', width: 3 },
                xaxis: { categories: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'], axisBorder: { show: false }, axisTicks: { show: false } },
                grid: { borderColor: '#f1f5f9', strokeDashArray: 4 },
                tooltip: { y: { formatter: function (val) { return val + " times" } } }
            };
            new ApexCharts(document.querySelector("#activity_chart"), optionsActivity).render();
        });
    </script>
    <!-- Redirect Script for Buttons and Dummy Links -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.top.location.href = '../404.html';
                });
            });
            
            document.querySelectorAll('a[href="#"], a[href=""]').forEach(a => {
                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.top.location.href = '../404.html';
                });
            });
        });
    </script>
</body>
</html>
