<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Earnings</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: transparent; }
        .dash-card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); height: 100%; border: 1px solid #f1f5f9; }
        .text-success { color: #28a745 !important; }
        .bg-success-light { background: rgba(40, 167, 69, 0.1); color: #28a745; }
        .chart-container { min-height: 300px; }
        @media (max-width: 576px) { .dash-card { padding: 15px; } }
    </style>
</head>
<body>
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <h4 class="fw-bold mb-0 text-dark">Earnings</h4>
            <button class="btn btn-success rounded-pill px-4" style="background:#28a745; border:none;">Action</button>
        </div>
        
        <div class="row g-4 mb-4">
            <div class="col-6 col-md-3">
                <div class="dash-card text-center">
                    <div class="text-muted small mb-2">Metric 1</div>
                    <h3 class="fw-bold text-success mb-0">349</h3>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="dash-card text-center">
                    <div class="text-muted small mb-2">Metric 2</div>
                    <h3 class="fw-bold text-success mb-0">1201</h3>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="dash-card text-center">
                    <div class="text-muted small mb-2">Metric 3</div>
                    <h3 class="fw-bold text-success mb-0">53%</h3>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="dash-card text-center">
                    <div class="text-muted small mb-2">Metric 4</div>
                    <h3 class="fw-bold text-success mb-0">6247</h3>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-12 col-lg-8">
                <div class="dash-card">
                    <h5 class="fw-bold mb-4">Performance Overview</h5>
                    <div id="chart1_delivery_earnings" class="chart-container"></div>
                </div>
            </div>
            <div class="col-12 col-lg-4">
                <div class="dash-card">
                    <h5 class="fw-bold mb-4">Recent Activity</h5>
                    
                    <div class="d-flex align-items-center justify-content-between mb-3 pb-3 border-bottom">
                        <div>
                            <div class="fw-semibold text-dark">Activity 1</div>
                            <div class="small text-muted">2 hours ago</div>
                        </div>
                        <span class="badge bg-success-light">Completed</span>
                    </div>
                    <div class="d-flex align-items-center justify-content-between mb-3 pb-3 border-bottom">
                        <div>
                            <div class="fw-semibold text-dark">Activity 2</div>
                            <div class="small text-muted">2 hours ago</div>
                        </div>
                        <span class="badge bg-success-light">Completed</span>
                    </div>
                    <div class="d-flex align-items-center justify-content-between mb-3 pb-3 border-bottom">
                        <div>
                            <div class="fw-semibold text-dark">Activity 3</div>
                            <div class="small text-muted">2 hours ago</div>
                        </div>
                        <span class="badge bg-success-light">Completed</span>
                    </div>
                    <div class="d-flex align-items-center justify-content-between mb-3 pb-3 border-bottom">
                        <div>
                            <div class="fw-semibold text-dark">Activity 4</div>
                            <div class="small text-muted">2 hours ago</div>
                        </div>
                        <span class="badge bg-success-light">Completed</span>
                    </div>
                    <div class="d-flex align-items-center justify-content-between mb-3 pb-3 border-bottom">
                        <div>
                            <div class="fw-semibold text-dark">Activity 5</div>
                            <div class="small text-muted">2 hours ago</div>
                        </div>
                        <span class="badge bg-success-light">Completed</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row g-4 mt-1">
            <div class="col-12">
                <div class="dash-card">
                    <h5 class="fw-bold mb-4">Detailed Analytics</h5>
                    <div id="chart2_delivery_earnings" class="chart-container"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var opt1 = {
                series: [{ name: 'Data', data: [60,56,3,91,87,11,27] }],
                chart: { type: 'area', height: 300, toolbar: { show: false }, fontFamily: 'Inter, sans-serif' },
                colors: ['#28a745'],
                fill: { type: 'gradient', gradient: { shadeIntensity: 1, opacityFrom: 0.4, opacityTo: 0.05, stops: [0, 90, 100] } },
                dataLabels: { enabled: false },
                stroke: { curve: 'smooth', width: 3 },
                xaxis: { categories: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'] }
            };
            var chart1 = new ApexCharts(document.querySelector("#chart1_delivery_earnings"), opt1);
            chart1.render();
            
            var opt2 = {
                series: [{ name: 'Metric A', data: [19,37,33,2,28,42] }, { name: 'Metric B', data: [34,4,21,22,27,23] }],
                chart: { type: 'bar', height: 300, toolbar: { show: false }, fontFamily: 'Inter, sans-serif' },
                colors: ['#28a745', '#82c91e'],
                plotOptions: { bar: { borderRadius: 4, columnWidth: '50%' } },
                dataLabels: { enabled: false },
                stroke: { show: true, width: 2, colors: ['transparent'] },
                xaxis: { categories: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'] },
                fill: { opacity: 1 }
            };
            var chart2 = new ApexCharts(document.querySelector("#chart2_delivery_earnings"), opt2);
            chart2.render();
        });
    </script>
</body>
</html>
