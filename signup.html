<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | Stackly Grocery & Supermarket</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
            background-color: var(--dark-bg);
            color: #ffffff;
        }

        .auth-card {
            background: rgba(9, 9, 11, 0.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6) !important;
            border-radius: 20px;
        }

        .unique-role-selector {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .unique-role-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px 5px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
        }

        .btn-check:checked + .unique-role-item {
            background: rgba(40, 167, 69, 0.1);
            border-color: var(--primary-color);
            color: #ffffff;
            box-shadow: 0 0 20px rgba(40, 167, 69, 0.3);
            transform: translateY(-3px);
        }

        .btn-check:checked + .unique-role-item span.material-symbols-outlined,
        .btn-check:checked + .unique-role-item .role-text {
            color: var(--primary-color);
            font-weight: bold;
        }

        .unique-role-item:hover {
            border-color: var(--primary-color);
            transform: translateY(-2px);
            color: #ffffff;
        }

        .toggle-password {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #adb5bd;
            border-left: none;
            transition: all 0.3s ease;
        }
        
        .input-group:focus-within .toggle-password {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }
        
        .toggle-password:hover {
            color: var(--primary-color);
        }
        
        .form-check-input {
            background-color: rgba(255,255,255,0.05);
            border-color: rgba(255, 255, 255, 0.2);
        }
        
        .form-check-input:checked {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        .auth-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }
        
        .auth-link:hover {
            color: var(--white);
        }
        
        .auth-input-custom {
            background: rgba(255,255,255,0.05) !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            color: white !important;
        }
        .auth-input-custom:focus {
            border-color: var(--primary-color) !important;
            box-shadow: 0 0 0 0.25rem rgba(40, 167, 69, 0.25) !important;
        }

        @media (max-width: 400px) {
            .unique-role-selector {
                flex-direction: column;
                gap: 8px;
            }
            .auth-card {
                padding: 1.5rem !important;
            }
        }
    </style>
</head>

<body>
    <!-- Premium Background -->
    <div class="position-fixed top-0 start-0 w-100 h-100 pointer-none" style="background: url('assets/images/img_12.webp') no-repeat center center; background-size: cover; z-index: -3;"></div>
    <!-- Stackly Green Gradient Overlay -->
    <div class="position-fixed top-0 start-0 w-100 h-100 pointer-none" style="background: linear-gradient(135deg, rgba(9, 9, 11, 0.95) 0%, rgba(40, 167, 69, 0.7) 100%); z-index: -2;"></div>
    <!-- Floating Orbs -->
    <div class="position-fixed top-0 end-0 translate-middle rounded-circle pointer-none" style="width: 400px; height: 400px; background: var(--primary-color); filter: blur(120px); opacity: 0.3; z-index: -1;"></div>
    
    <div class="container position-relative z-1 py-3">
        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-8 col-xl-6">
                <div class="auth-card p-4 p-lg-5 hover-elevate transition-all" data-aos="zoom-in" data-aos-duration="800">
                    
                    <div class="text-center mb-5">
                        <a href="index.html" class="small auth-link mb-3 d-inline-block"><i class="fas fa-arrow-left me-2"></i> Return to Home</a>
                        <h2 class="display-6 fw-bold mb-2 text-white">Create an Account</h2>
                        <p class="text-light opacity-75">Join the Stackly Grocery & Supermarket family today.</p>
                    </div>

                    <form id="signupForm">
                        <label class="form-label text-light opacity-75 small fw-bold letter-spacing-1 text-uppercase mb-3 d-block text-center">I want to register as a...</label>
                        <div class="unique-role-selector mb-4">
                            <!-- Role 1: Customer -->
                            <input type="radio" class="btn-check" name="role" id="roleCustomer" value="Customer" checked autocomplete="off">
                            <label class="unique-role-item" for="roleCustomer">
                                <span class="material-symbols-outlined fs-3 mb-1">shopping_cart</span>
                                <span class="role-text small">Customer</span>
                            </label>

                            <!-- Role 2: Store Admin -->
                            <input type="radio" class="btn-check" name="role" id="roleAdmin" value="Admin" autocomplete="off">
                            <label class="unique-role-item" for="roleAdmin">
                                <span class="material-symbols-outlined fs-3 mb-1">store</span>
                                <span class="role-text small">Store Admin</span>
                            </label>

                            <!-- Role 3: Delivery -->
                            <input type="radio" class="btn-check" name="role" id="roleDelivery" value="Delivery" autocomplete="off">
                            <label class="unique-role-item" for="roleDelivery">
                                <span class="material-symbols-outlined fs-3 mb-1">local_shipping</span>
                                <span class="role-text small">Delivery</span>
                            </label>
                        </div>

                        <div class="row g-4 mb-4">
                            <div class="col-md-6">
                                <label class="form-label text-light opacity-75 small fw-bold letter-spacing-1 text-uppercase">Full Name</label>
                                <input class="form-control auth-input-custom py-3 shadow-none rounded-3" type="text" id="name" placeholder="John Doe" required pattern="[A-Za-z\s]+"
                     oninput="this.value = this.value.replace(/[^A-Za-z\s]/g, '')">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-light opacity-75 small fw-bold letter-spacing-1 text-uppercase">Email Address</label>
                                <input class="form-control auth-input-custom py-3 shadow-none rounded-3" type="email" id="email" placeholder="name@domain.com" required>
                            </div>
                        </div>

                        <div class="row g-4 mb-2">
                            <div class="col-md-6">
                                <label class="form-label text-light opacity-75 small fw-bold letter-spacing-1 text-uppercase">Password</label>
                                <div class="input-group">
                                    <input class="form-control auth-input-custom border-end-0 py-3 shadow-none rounded-start-3" type="password" id="password" placeholder="Create password" minlength="8" required>
                                    <button class="btn toggle-password rounded-end-3" type="button" style="padding-left: 15px; padding-right: 15px;" id="togglePwd1">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                                <!-- Strength bar -->
                                <div class="mt-2" style="height:4px;border-radius:4px;background:rgba(255,255,255,0.1);overflow:hidden;">
                                    <div id="strengthBar" style="height:100%;width:0;transition:width 0.3s, background 0.3s;"></div>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label text-light opacity-75 small fw-bold letter-spacing-1 text-uppercase">Confirm Password</label>
                                <div class="input-group">
                                    <input class="form-control auth-input-custom border-end-0 py-3 shadow-none rounded-start-3" type="password" id="confirmPassword" placeholder="Confirm password" required>
                                    <button class="btn toggle-password rounded-end-3" type="button" style="padding-left: 15px; padding-right: 15px;" id="togglePwd2">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                                <div id="matchMsg" class="small mt-2" style="min-height: 20px;"></div>
                            </div>
                        </div>
                        
                        <div class="mb-4"></div>

                        <div class="form-check mb-5 text-start">
                            <input class="form-check-input shadow-none" type="checkbox" id="terms" required>
                            <label class="form-check-label text-light opacity-75 small fw-semibold" for="terms">
                                I accept the <a href="404.html" class="auth-link">Terms & Conditions</a>
                            </label>
                        </div>

                        <button type="submit" class="btn btn-theme-primary w-100 py-3 fw-bold mb-4 d-flex align-items-center justify-content-center gap-2">
                            Create Account <i class="bi bi-person-plus-fill ms-1"></i>
                        </button>

                        <p class="text-center mb-0 small text-light opacity-75">Already have an account? <a href="login.html" class="fw-bold auth-link ms-1">Login Here</a></p>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    
    <script>
        AOS.init();

        // Toggle Password Visibility
        const setupToggle = (btnId, inputId) => {
            const btn = document.getElementById(btnId);
            const input = document.getElementById(inputId);
            if(btn && input) {
                btn.addEventListener('click', function() {
                    const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                    input.setAttribute('type', type);
                    this.querySelector('i').classList.toggle('fa-eye');
                    this.querySelector('i').classList.toggle('fa-eye-slash');
                });
            }
        };
        setupToggle('togglePwd1', 'password');
        setupToggle('togglePwd2', 'confirmPassword');

        // Live password strength
        const pwdInput = document.getElementById('password');
        const confirmPwd = document.getElementById('confirmPassword');
        const bar = document.getElementById('strengthBar');
        const matchMsg = document.getElementById('matchMsg');
        
        if (pwdInput && bar) {
            const rules = {
                'r-len': v => v.length >= 8,
                'r-upper': v => /[A-Z]/.test(v),
                'r-num': v => /[0-9]/.test(v),
                'r-sym': v => /[^A-Za-z0-9]/.test(v)
            };
            const colors = ['#dc3545', '#fd7e14', '#ffc107', '#10b981']; // Red, Orange, Yellow, Emerald Green
            
            pwdInput.addEventListener('input', () => {
                const v = pwdInput.value;
                let passed = 0;
                Object.values(rules).forEach(fn => {
                    if (fn(v)) passed++;
                });
                bar.style.width = (passed / 4 * 100) + '%';
                bar.style.background = colors[passed - 1] || 'rgba(255,255,255,0.1)';
                checkMatch();
            });
        }
        
        if (confirmPwd) {
            confirmPwd.addEventListener('input', checkMatch);
        }

        function checkMatch() {
            if(!confirmPwd.value) {
                matchMsg.textContent = '';
                return;
            }
            if(pwdInput.value === confirmPwd.value) {
                matchMsg.textContent = 'Passwords match';
                matchMsg.className = 'small mt-2 text-success fw-bold';
            } else {
                matchMsg.textContent = 'Passwords do not match';
                matchMsg.className = 'small mt-2 text-danger fw-bold';
            }
        }
    </script>
</body>
</html>
