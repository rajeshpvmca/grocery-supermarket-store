<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 Not Found | Stackly Grocery & Supermarket</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="css/styles.css">
    
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8fafc;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            position: relative;
            margin: 0;
        }

        /* Abstract Green Floating Blobs */
        .blob-1, .blob-2 {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            z-index: -1;
            opacity: 0.3;
            animation: floatBlob 10s ease-in-out infinite alternate;
        }
        .blob-1 {
            width: 450px;
            height: 450px;
            background: var(--primary-color, #28a745);
            top: -100px;
            left: -100px;
        }
        .blob-2 {
            width: 350px;
            height: 350px;
            background: #82c91e;
            bottom: -50px;
            right: -100px;
            animation-delay: -5s;
        }

        /* Floating Grocery Background Elements */
        .bg-grocery-icon {
            position: absolute;
            color: rgba(40, 167, 69, 0.08);
            z-index: -1;
            font-size: 8rem;
            animation: floatIcon 15s linear infinite;
        }
        .icon-1 { top: 15%; left: 10%; animation-delay: 0s; }
        .icon-2 { bottom: 15%; right: 10%; font-size: 10rem; animation-delay: -5s; animation-direction: reverse; }
        .icon-3 { top: 40%; right: 20%; font-size: 6rem; animation-delay: -10s; }
        .icon-4 { bottom: 30%; left: 15%; font-size: 7rem; animation-delay: -7s; }

        @keyframes floatIcon {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(15deg); }
            100% { transform: translateY(0) rotate(360deg); }
        }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 30px) scale(1.1); }
        }

        /* 404 Card Styling (Enhanced Glassmorphism) */
        .error-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 35px;
            padding: 4rem;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.04), inset 0 0 0 2px rgba(255,255,255,0.4);
            text-align: center;
            max-width: 650px;
            width: 90%;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 10;
        }

        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .error-code {
            font-family: 'Montserrat', sans-serif;
            font-size: 8.5rem;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, var(--primary-color, #28a745), #155d27);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            text-shadow: 0px 10px 30px rgba(40,167,69,0.25);
            letter-spacing: -5px;
        }

        .error-icon-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 0;
            line-height: 1;
        }
        
        .error-icon {
            font-size: 7.5rem;
            color: var(--primary-color, #28a745);
            animation: tilt 2s ease-in-out infinite alternate;
            filter: drop-shadow(0 10px 15px rgba(40,167,69,0.2));
            /* Override text-fill-color from error-code gradient */
            -webkit-text-fill-color: var(--primary-color, #28a745);
        }

        .error-icon-leaf {
            position: absolute;
            top: -20px;
            right: -25px;
            font-size: 2.5rem;
            color: #82c91e;
            animation: floatLeaf 3s ease-in-out infinite;
            -webkit-text-fill-color: #82c91e;
        }

        @keyframes tilt {
            0% { transform: rotate(-8deg); }
            100% { transform: rotate(8deg); }
        }
        @keyframes floatLeaf {
            0%, 100% { transform: translateY(0) rotate(0); }
            50% { transform: translateY(-10px) rotate(15deg); }
        }

        .error-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            color: #1e293b;
            font-size: 2.2rem;
            margin-bottom: 0.8rem;
        }

        .error-desc {
            color: #64748b;
            font-size: 1.15rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
            padding: 0 15px;
        }

        /* 320px Perfect Responsiveness */
        @media (max-width: 576px) {
            .error-card { padding: 2.5rem 1.5rem; border-radius: 20px; }
            .error-code { font-size: 6rem; }
            .error-title { font-size: 1.8rem; }
            .error-icon { font-size: 5rem; }
            .error-icon-leaf { font-size: 1.8rem; top: -15px; right: -20px; }
            .bg-grocery-icon { opacity: 0.5; }
        }
        
        @media (max-width: 360px) {
            .error-code { font-size: 5rem; }
            .error-icon { font-size: 4rem; }
            .error-icon-leaf { font-size: 1.5rem; top: -10px; right: -15px; }
            .error-title { font-size: 1.5rem; }
            .error-desc { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <!-- Background Decoration -->
    <div class="blob-1"></div>
    <div class="blob-2"></div>
    <i class="fa-solid fa-apple-whole bg-grocery-icon icon-1"></i>
    <i class="fa-solid fa-carrot bg-grocery-icon icon-2"></i>
    <i class="fa-solid fa-bowl-food bg-grocery-icon icon-3"></i>
    <i class="fa-solid fa-bottle-water bg-grocery-icon icon-4"></i>

    <div class="error-card">
        <!-- Logo -->
        <a href="index.html">
            <div style="-webkit-mask: url('assets/images/logoStackly.webp') no-repeat center center; -webkit-mask-size: contain; mask: url('assets/images/logoStackly.webp') no-repeat center center; mask-size: contain; background: var(--primary-color, #28a745); width: 180px; height: 50px; margin: 0 auto 2.5rem auto;" aria-label="Stackly Logo"></div>
        </a>
        
        <!-- Content -->
        <div class="error-code d-flex align-items-center justify-content-center">
            <span>4</span>
            <div class="error-icon-wrapper mx-1 mx-sm-3">
                <i class="fa-solid fa-basket-shopping error-icon m-0"></i>
                <i class="fa-solid fa-leaf error-icon-leaf"></i>
            </div>
            <span>4</span>
        </div>
        <h3 class="error-title">Aisle Empty!</h3>
        <p class="error-desc">Oops! We couldn't find the page you're looking for. It might have been moved, deleted, or you took a wrong turn in the store.</p>
        
        <!-- Actions using Theme Buttons -->
        <div class="d-flex flex-column flex-sm-row justify-content-center gap-3 mt-4">
            <button onclick="window.history.length > 1 ? window.history.back() : window.location.href='index.html'" class="btn btn-theme-secondary d-flex align-items-center justify-content-center gap-2 border border-2 border-success border-opacity-25 shadow-sm">
                <i class="fa-solid fa-arrow-left"></i> Go Back
            </button>
            <a href="index.html" class="btn btn-theme-primary d-flex align-items-center justify-content-center gap-2 border-0 shadow">
                <i class="fa-solid fa-house"></i> Return to Home
            </a>
        </div>
    </div>

</body>
</html>
